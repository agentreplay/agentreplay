<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agentreplay Desktop</title>
  <style>
    #root:empty::before {
      content: "Loading Agentreplay...";
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #b0b8bf;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script>
    // WebKit/Safari rate-limits history.replaceState to 100 calls per 10s.
    // React Router + StrictMode can exceed this during init. Deduplicate
    // identical consecutive replaceState calls to stay under the limit.
    (function() {
      var orig = History.prototype.replaceState;
      var lastUrl = null;
      var lastState = null;
      History.prototype.replaceState = function(state, title, url) {
        var u = url ? String(url) : null;
        if (u === lastUrl) return; // skip identical consecutive calls
        lastUrl = u;
        lastState = state;
        return orig.call(this, state, title, url);
      };
    })();
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
