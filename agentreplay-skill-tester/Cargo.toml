[package]
name = "agentreplay-skill-tester"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AgentReplay Skill Tester — test, debug, and certify AI agent skills"

[dependencies]
# Workspace crates
agentreplay-core = { path = "../agentreplay-core" }
agentreplay-evals = { path = "../agentreplay-evals" }
agentreplay-storage = { path = "../agentreplay-storage" }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = "0.9"

# Async
tokio = { workspace = true }
async-trait = "0.1"

# Hashing
blake3 = { workspace = true }
hex = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# CLI
clap = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Data structures
dashmap = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }

# JSON Schema validation
jsonschema = "0.18"

# Regex
regex = "1.10"

# UUID
uuid = { version = "1.6", features = ["v4"] }

# HTTP (for web UI server)
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }

# Glob pattern matching
glob = "0.3"

# Binary detection
which = "6.0"

[dev-dependencies]
tempfile = { workspace = true }
