# GitHub Actions - Release Build for All Platforms
# Equivalent to Azure Pipelines: release-*.yml

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for manual release (e.g., 0.2.1). Creates a draft release with this tag.'
        required: true
        default: '0.2.1'
      create_release:
        description: 'Create a draft release with artifacts'
        type: boolean
        default: true

env:
  CARGO_TERM_COLOR: always
  # Use input version for workflow_dispatch, otherwise extract from release tag
  RELEASE_VERSION: ${{ github.event.inputs.version || github.event.release.tag_name }}

jobs:
  # ============================================
  # macOS Apple Silicon (arm64)
  # ============================================
  build-macos-arm:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agentreplay-ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'agentreplay-tauri -> target'
          cache-targets: true

      - name: Cache Cargo bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-tauri-2.0

      - name: Install frontend dependencies
        working-directory: agentreplay-ui
        run: npm ci

      - name: Build frontend
        working-directory: agentreplay-ui
        run: npm run build

      - name: Install Tauri CLI
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "^2.0"
          fi

      - name: Build Tauri App
        working-directory: agentreplay-tauri
        run: cargo tauri build --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Rename artifacts for consistency
        run: |
          cd agentreplay-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          dmg_count=$(ls -1 *.dmg 2>/dev/null | wc -l)
          if [ "$dmg_count" -eq 0 ]; then
            echo "ERROR: No DMG files found!"
            exit 1
          elif [ "$dmg_count" -gt 1 ]; then
            echo "WARNING: Multiple DMG files found, renaming first one"
          fi
          for f in *.dmg; do
            if [ -f "$f" ]; then
              mv "$f" "Agentreplay_aarch64.dmg"
              echo "Renamed $f to Agentreplay_aarch64.dmg"
              break
            fi
          done

      - name: Upload macOS ARM DMG
        uses: actions/upload-artifact@v4
        with:
          name: Agentreplay-macos-aarch64
          path: |
            agentreplay-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            agentreplay-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz
            agentreplay-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz.sig
          if-no-files-found: warn

  # ============================================
  # macOS Intel (x64)
  # ============================================
  build-macos-intel:
    name: Build macOS (Intel)
    runs-on: macos-13  # Intel runner for native x64 build
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agentreplay-ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'agentreplay-tauri -> target'
          cache-targets: true

      - name: Cache Cargo bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-tauri-2.0

      - name: Install frontend dependencies
        working-directory: agentreplay-ui
        run: npm ci

      - name: Build frontend
        working-directory: agentreplay-ui
        run: npm run build

      - name: Install Tauri CLI
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "^2.0"
          fi

      - name: Build Tauri App
        working-directory: agentreplay-tauri
        run: cargo tauri build --target x86_64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Rename artifacts for consistency
        run: |
          cd agentreplay-tauri/target/x86_64-apple-darwin/release/bundle/dmg
          dmg_count=$(ls -1 *.dmg 2>/dev/null | wc -l)
          if [ "$dmg_count" -eq 0 ]; then
            echo "ERROR: No DMG files found!"
            exit 1
          elif [ "$dmg_count" -gt 1 ]; then
            echo "WARNING: Multiple DMG files found, renaming first one"
          fi
          for f in *.dmg; do
            if [ -f "$f" ]; then
              mv "$f" "Agentreplay_x64.dmg"
              echo "Renamed $f to Agentreplay_x64.dmg"
              break
            fi
          done

      - name: Upload macOS Intel DMG
        uses: actions/upload-artifact@v4
        with:
          name: Agentreplay-macos-x64
          path: |
            agentreplay-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            agentreplay-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.tar.gz
            agentreplay-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.tar.gz.sig
          if-no-files-found: warn

  # ============================================
  # Linux Build (AppImage, .deb)
  # ============================================
  build-linux:
    name: Build Linux (AppImage + Deb)
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agentreplay-ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'agentreplay-tauri -> target'
          cache-targets: true

      - name: Cache Cargo bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-tauri-2.0

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: agentreplay-ui
        run: npm ci

      - name: Build frontend
        working-directory: agentreplay-ui
        run: npm run build

      - name: Install Tauri CLI
        run: |
          if ! command -v cargo-tauri &> /dev/null; then
            cargo install tauri-cli --version "^2.0"
          fi

      - name: Build Tauri App
        working-directory: agentreplay-tauri
        run: cargo tauri build --target x86_64-unknown-linux-gnu
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Rename artifacts for consistency
        run: |
          # Rename AppImage
          cd agentreplay-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage
          appimage_count=$(ls -1 *.AppImage 2>/dev/null | wc -l)
          if [ "$appimage_count" -eq 0 ]; then
            echo "ERROR: No AppImage files found!"
            exit 1
          fi
          for f in *.AppImage; do
            if [ -f "$f" ]; then
              mv "$f" "Agentreplay_amd64.AppImage"
              echo "Renamed $f to Agentreplay_amd64.AppImage"
              break
            fi
          done
          
          # Rename Deb
          cd ../deb
          deb_count=$(ls -1 *.deb 2>/dev/null | wc -l)
          if [ "$deb_count" -eq 0 ]; then
            echo "ERROR: No .deb files found!"
            exit 1
          fi
          for f in *.deb; do
            if [ -f "$f" ]; then
              mv "$f" "Agentreplay_amd64.deb"
              echo "Renamed $f to Agentreplay_amd64.deb"
              break
            fi
          done

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Agentreplay-linux-appimage
          path: |
            agentreplay-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            agentreplay-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz
            agentreplay-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz.sig
            agentreplay-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: warn

      - name: Upload Linux Deb
        uses: actions/upload-artifact@v4
        with:
          name: Agentreplay-linux-deb
          path: agentreplay-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: error

  # ============================================
  # Windows Build (EXE, MSI)
  # ============================================
  build-windows:
    name: Build Windows (EXE + MSI)
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: agentreplay-ui/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'agentreplay-tauri -> target'
          cache-targets: true

      - name: Cache Cargo bin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: ${{ runner.os }}-cargo-bin-tauri-2.0

      - name: Install frontend dependencies
        working-directory: agentreplay-ui
        run: npm ci

      - name: Build frontend
        working-directory: agentreplay-ui
        run: npm run build

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Build Tauri App
        working-directory: agentreplay-tauri
        run: cargo tauri build --target x86_64-pc-windows-msvc
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Rename artifacts for consistency
        shell: bash
        run: |
          # Rename EXE
          cd agentreplay-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          exe_count=$(ls -1 *.exe 2>/dev/null | wc -l)
          if [ "$exe_count" -eq 0 ]; then
            echo "ERROR: No EXE files found!"
            exit 1
          fi
          for f in *.exe; do
            if [ -f "$f" ]; then
              mv "$f" "Agentreplay_x64-setup.exe"
              echo "Renamed $f to Agentreplay_x64-setup.exe"
              break
            fi
          done
          
          # Rename MSI
          cd ../msi
          msi_count=$(ls -1 *.msi 2>/dev/null | wc -l)
          if [ "$msi_count" -eq 0 ]; then
            echo "ERROR: No MSI files found!"
            exit 1
          fi
          for f in *.msi; do
            if [ -f "$f" ]; then
              mv "$f" "Agentreplay_x64.msi"
              echo "Renamed $f to Agentreplay_x64.msi"
              break
            fi
          done

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Agentreplay-windows-exe
          path: |
            agentreplay-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            agentreplay-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip
            agentreplay-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip.sig
          if-no-files-found: warn

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v4
        with:
          name: Agentreplay-windows-msi
          path: |
            agentreplay-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            agentreplay-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.zip
            agentreplay-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.zip.sig
          if-no-files-found: warn

  # ============================================
  # Create Release with All Artifacts
  # ============================================
  release:
    name: Create Release
    needs: [build-macos-arm, build-macos-intel, build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Run on release trigger OR when workflow_dispatch with create_release=true
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Flatten artifacts into release-assets
        run: |
          mkdir -p release-assets
          # Copy all release-relevant files into a flat directory
          find artifacts -type f \( \
            -name "*.dmg" -o \
            -name "*.AppImage" -o -name "*.AppImage.tar.gz" -o -name "*.AppImage.tar.gz.sig" -o -name "*.AppImage.sig" -o \
            -name "*.deb" -o \
            -name "*.exe" -o -name "*.nsis.zip" -o -name "*.nsis.zip.sig" -o \
            -name "*.msi" -o -name "*.msi.zip" -o -name "*.msi.zip.sig" -o \
            -name "*.tar.gz" -o -name "*.tar.gz.sig" \
          \) -exec cp {} release-assets/ \;
          echo "=== Release Assets ==="
          ls -la release-assets/
          echo "======================"

      - name: Generate Tauri updater latest.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="agentreplay/agentreplay"
          BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"

          cd release-assets

          # --- Find updater-compatible files for each platform ---
          # Tauri v2 updater expects: .app.tar.gz (macOS), .AppImage.tar.gz (Linux), .nsis.zip (Windows)

          # macOS aarch64: .tar.gz from macos/ bundle (NOT the .dmg)
          MAC_AARCH64_FILE=$(ls -1 *aarch64*.app.tar.gz 2>/dev/null | head -1 || true)
          if [ -z "$MAC_AARCH64_FILE" ]; then
            MAC_AARCH64_FILE=$(ls -1 *aarch64*.tar.gz 2>/dev/null | grep -v '\.sig$' | head -1 || true)
          fi

          # macOS x86_64: .tar.gz from macos/ bundle
          MAC_X64_FILE=$(ls -1 *x64*.app.tar.gz 2>/dev/null | head -1 || true)
          if [ -z "$MAC_X64_FILE" ]; then
            MAC_X64_FILE=$(ls -1 *x86_64*.tar.gz 2>/dev/null | grep -v '\.sig$' | head -1 || true)
            if [ -z "$MAC_X64_FILE" ]; then
              MAC_X64_FILE=$(ls -1 *x64*.tar.gz 2>/dev/null | grep -v '\.sig$' | head -1 || true)
            fi
          fi

          # Linux x86_64: .AppImage.tar.gz preferred, fallback to .AppImage
          LINUX_FILE=$(ls -1 *.AppImage.tar.gz 2>/dev/null | grep -v '\.sig$' | head -1 || true)
          if [ -z "$LINUX_FILE" ]; then
            LINUX_FILE=$(ls -1 *.AppImage 2>/dev/null | head -1 || true)
          fi

          # Windows x86_64: .nsis.zip
          WINDOWS_FILE=$(ls -1 *.nsis.zip 2>/dev/null | grep -v '\.sig$' | head -1 || true)

          echo "Updater files found:"
          echo "  macOS aarch64: ${MAC_AARCH64_FILE:-NONE}"
          echo "  macOS x64:     ${MAC_X64_FILE:-NONE}"
          echo "  Linux:         ${LINUX_FILE:-NONE}"
          echo "  Windows:       ${WINDOWS_FILE:-NONE}"

          # --- Read signatures from matching .sig files ---
          read_sig() { cat "${1}.sig" 2>/dev/null || cat "${1%.*}.sig" 2>/dev/null || echo ""; }

          MAC_AARCH64_SIG=$(read_sig "$MAC_AARCH64_FILE")
          MAC_X64_SIG=$(read_sig "$MAC_X64_FILE")
          LINUX_SIG=$(read_sig "$LINUX_FILE")
          WINDOWS_SIG=$(read_sig "$WINDOWS_FILE")

          cd ..

          # --- Write latest.json ---
          cat > release-assets/latest.json << ENDJSON
          {
            "version": "${VERSION}",
            "notes": "See release notes at https://github.com/${REPO}/releases/tag/${VERSION}",
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_AARCH64_SIG}",
                "url": "${BASE_URL}/${MAC_AARCH64_FILE}"
              },
              "darwin-x86_64": {
                "signature": "${MAC_X64_SIG}",
                "url": "${BASE_URL}/${MAC_X64_FILE}"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${BASE_URL}/${LINUX_FILE}"
              },
              "windows-x86_64": {
                "signature": "${WINDOWS_SIG}",
                "url": "${BASE_URL}/${WINDOWS_FILE}"
              }
            }
          }
          ENDJSON

          # Remove leading whitespace from heredoc
          sed -i 's/^          //' release-assets/latest.json

          echo "=== Generated latest.json ==="
          cat release-assets/latest.json
          echo "=============================="

      - name: Upload to existing Release (release trigger)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Draft Release (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: Agent Replay Alpha v${{ github.event.inputs.version }}
          draft: true
          generate_release_notes: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
