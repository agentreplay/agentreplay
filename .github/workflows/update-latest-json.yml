name: Update Tauri latest.json

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to use (recommended: v0.2.2). Avoid main for production releases.'
        required: true
        default: 'v0.2.2'

permissions:
  contents: write

jobs:
  generate-latest-json:
    name: Generate and upload latest.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate tag input
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [[ ! "$TAG" =~ ^(main|v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)?)$ ]]; then
            echo "Invalid tag: $TAG"
            echo "Use semantic version tag like v0.2.2"
            exit 1
          fi

      - name: Generate and upload latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          bash .github/scripts/update_latest_json.sh "$TAG"
